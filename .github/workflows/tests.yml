name: Lua tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        interpreter: [lua5.1, luajit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Lua interpreters and the game-compatible bit library
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.1 lua-bitop luajit
      - name: Run functional, cryptographic and adversarial tests
        env:
          CZ_TEST_PROGRESS: '1'
        run: ${{ matrix.interpreter }} tests/run.lua
