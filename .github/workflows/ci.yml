name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Тот же набор проверок перед сборкой релиза (release.yml).
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # В PR старый прогон не нужен после нового пуша; на main доводим каждый.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Luacheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Настройки — в .luacheckrc; libs/ не проверяются.
      - uses: lunarmodules/luacheck@v1.2.0

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install LuaJIT
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends luajit
      - name: Run tests
        run: luajit tests/run.lua
